<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <title>RSVP</title>
    <style>
      body {
        font-family: 'Segoe UI', sans-serif;
        background-color: #c5c6de;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .side-by-side-container {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        max-width: 1100px;
        width: 95%;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 4px 12px #ccc;
        overflow: hidden;
      }

      #image-container {
        flex: 1;
        background-color: #a0a2d9;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      #image-container img {
        width: 100%;
        max-width: 500px;
        height: auto;
        border-radius: 8px;
      }

      .rsvp-container {
        flex: 1;
        background-color: #a0a2d9;
        padding: 3rem;
        box-sizing: border-box;
      }

      h2 {
        text-align: center;
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin: 1rem 0 0.5rem;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 1rem;
        box-sizing: border-box;
      }

      button {
        background-color: #9a9ba6;
        color: white;
        border: none;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      button:disabled {
        background-color: #999;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        background-color: #4a4a61;
      }

      @media (max-width: 768px) {
        .side-by-side-container {
          flex-direction: column;
        }

        #image-container {
          padding: 1rem 0;
        }

        .rsvp-container {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="side-by-side-container">
      <div id="image-container">
        <img src="christina.jpg" alt="Baptism" />
      </div>
      <div class="rsvp-container">
        <h2>Η βάφτισή μου</h2>
        <form id="rsvp-form" action="https://script.google.com/macros/s/AKfycby31mF_mydkDVa_PMGNugwc5-fmbwrPco1KOgr0t-pDEw8MSgOQMa23RsgX2e6KratHKA/exec" method="POST">
          <input type="hidden" name="_captcha" value="false">

          <label for="name">Ονοματεπώνυμο</label>
          <input type="text" id="name" name="name" required />

          <label for="attendance">Επιβεβαίωση παρουσίας</label>
          <select id="attendance" name="attendance" required>
            <option value="">-- Επιλέξτε --</option>
            <option value="yes">Ναι</option>
            <option value="no">Όχι</option>
          </select>

          <div id="guests-section" style="display:none;">
            <label for="guests">Αριθμός ενηλίκων</label>
            <input type="number" id="guests" name="guests" min="1" max="10" />
			<label for="childs">Αριθμός παιδιών</label>
            <input type="number" id="childs" name="childs" />
          </div>

          <label for="phone">Τηλέφωνο Επικοινωνίας</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required />

          <div class="g-recaptcha" data-sitekey="6Ldo320sAAAAALHctDZlnQSF52DxeHkW9qAgo5xW"></div>
          <button type="submit" id="submit-btn">Αποθήκευση</button>
        </form>
      </div>
    </div>

    <script>
      const attendance = document.getElementById("attendance");
      const guestsSection = document.getElementById("guests-section");
      const form = document.getElementById("rsvp-form");
      const submitBtn = document.getElementById("submit-btn");

      attendance.addEventListener("change", function() {
        guestsSection.style.display = this.value === "yes" ? "block" : "none";
      });

      form.addEventListener("submit", function(event) {
        event.preventDefault(); // prevent default submission first

        // disable button immediately
        submitBtn.disabled = true;
        submitBtn.innerText = "Αποθήκευση...";

        // send form data via fetch
        fetch(form.action, {
          method: "POST",
          body: new FormData(form)
        })
        .then(response => {
          if (response.ok) {
            submitBtn.innerText = "Η απάντηση καταχωρήθηκε ✔️";
            // keep button disabled permanently
          } else {
            alert("Σφάλμα! Παρακαλώ προσπαθήστε ξανά.");
            submitBtn.disabled = false;
            submitBtn.innerText = "Αποθήκευση";
          }
        })
        .catch(() => {
          alert("Σφάλμα σύνδεσης! Παρακαλώ προσπαθήστε ξανά.");
          submitBtn.disabled = false;
          submitBtn.innerText = "Αποθήκευση";
        });
      });
    </script>
  </body>
</html>
